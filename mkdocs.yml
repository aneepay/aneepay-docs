site_name: AneePay Docs
site_description: "AneePay documentation: crypto payment acceptance, CMS plugins, x402, and API"
site_url: https://aneepay.github.io/aneepay-docs/
repo_url: https://github.com/aneepay/aneepay-docs
repo_name: aneepay/aneepay-docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started:
      - Product overview: getting-started/overview.md
      - Quickstart: getting-started/quickstart.md
      - Account setup: getting-started/account-setup.md
      - Payment lifecycle: getting-started/payment-lifecycle.md
      - Glossary: getting-started/glossary.md
  - Merchant:
      - merchant/index.md
      - Payment acceptance:
          - Create a payment: payments/create-payment.md
          - Hosted checkout and dApp: payments/checkout-and-dapp.md
          - Status and polling: payments/status-and-polling.md
          - Split payments: payments/split-payments.md
          - Reconciliation: payments/reconciliation.md
          - Networks, tokens, and fees: payments/networks-tokens-fees.md
          - Amounts, rounding, and limits: payments/amounts-rounding-and-limits.md
          - Refunds and non-features: payments/refunds-cancellations-and-non-features.md
          - Security and privacy: payments/security-and-privacy.md
          - Idempotency and retries: payments/idempotency-and-retries.md
      - Webhooks:
          - Webhooks overview: webhooks/overview.md
          - Payload and signature: webhooks/payload-and-signature.md
          - Delivery, retries, idempotency: webhooks/delivery-retries-idempotency.md
          - Testing and replay: webhooks/testing-and-replay.md
  - Errors, sandbox, and support:
      - Errors: errors/index.md
      - Sandbox: sandbox.md
      - Testing your integration: testing-your-integration.md
      - Security best practices: security/best-practices.md
      - Troubleshooting: troubleshooting.md
      - FAQ: faq.md
  - CMS: cms/index.md
  - x402: x402/index.md
  - Partner: partner/index.md
  - API: api/index.md
  - Developers: developers/index.md
  - Reference: reference/index.md

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aneepay
