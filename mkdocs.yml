site_name: Aneepay Docs
site_description: Documentation for the Aneepay platform
site_url: https://aneepay.github.io/aneepay-docs/
repo_url: https://github.com/aneepay/aneepay-docs
repo_name: aneepay/aneepay-docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Getting Started:
      - index.md
      - quickstart.md
  - Guides:
      - guides/getting-started.md
      - guides/payments.md
      - guides/webhooks.md
  - API:
      - api/overview.md
      - api/authentication.md
      - api/endpoints.md
  - About:
      - about.md

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aneepay
